# Intel IPU7 + Sony IMX471 front camera, ThinkPad X1 Carbon Gen 14.
#
# There is no USB bus to trace: the sensor is on MIPI CSI-2 behind a PCIe
# image processing unit, wired up through ACPI. So USB_VID/USB_PID are empty
# and the work happens through 'winctl probe' (INF files, registry, ACPI) and
# 'hwdbg' (modules, i2c, EEPROM, debugfs) instead of 'usbcap'.
#
# The VM is still useful - it is where the vendor driver package installs and
# where Windows' own view of the ACPI/PnP wiring can be dumped - but the
# device itself is never passed through.

VM_NAME=win11
VM_LIBVIRT_URI=qemu:///system
VM_HOST=

USB_VID=
USB_PID=

WINCTL_DISPLAY=:99
WINCTL_GEOMETRY=1920x1080
RDP_DOMAIN_DEFAULT=MicrosoftAccount
