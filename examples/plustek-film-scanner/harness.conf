# Plustek film scanner (OpticFilm-class), USB, vendor-specific class.
#
#   lsusb: Bus 003 Device 018: ID 07b3:1825 Plustek Film Scanner(A2M)
#   bDeviceClass ff, bDeviceProtocol ff, 480Mbps, bcdDevice 0702
#
# A vendor-specific device class means there is no standard protocol to fall
# back on: everything has to come from observation. This is the textbook case
# for the usbcap half of the harness.

VM_NAME=win11
VM_LIBVIRT_URI=qemu:///system
VM_HOST=

USB_VID=07b3
USB_PID=1825

WINCTL_DISPLAY=:99
WINCTL_GEOMETRY=1920x1080
RDP_DOMAIN_DEFAULT=MicrosoftAccount
