name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          # -x follows the sourced library so variables set there resolve.
          shellcheck -x --severity=warning \
            bin/harness bin/winctl bin/usbcap bin/hostdev bin/hwdbg
      - name: Check the sourced library
        # Sourced, never executed, so it needs an explicit shell directive.
        run: shellcheck --shell=bash --severity=warning lib/common.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path probes -Recurse -Severity Error,Warning
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
          Write-Host 'PSScriptAnalyzer: clean'
